# ==============================================================
# aigcog.com  生产环境 nginx 配置
# --------------------------------------------------------------
# 架构：
#   [客户端 HTTPS] ─► nginx:443 ─┬─► 静态站点  /www/wx-studio/dist
#                                 ├─► /uploads/  本地图片
#                                 ├─► /api/   ─► 127.0.0.1:8000   (FastAPI, 站内 JWT)
#                                 ├─► /auth/  ─► 127.0.0.1:8000   (FastAPI, 登录/短信)
#                                 └─► /v1/    ─► 127.0.0.1:8000   (FastAPI, OpenAI 兼容对外 API, sk-xxx)
#
# SSL 证书由 certbot 自动签发到：
#   /etc/letsencrypt/live/aigcog.com/fullchain.pem
#   /etc/letsencrypt/live/aigcog.com/privkey.pem
# ==============================================================

# ---- 1) HTTP → HTTPS 强制跳转 ----
server {
    listen 80;
    listen [::]:80;
    server_name aigcog.com www.aigcog.com;

    # certbot 续签用的 ACME 校验路径，保留
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余一律跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 2) 主站 HTTPS ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aigcog.com www.aigcog.com;

    # --- SSL 证书 ---
    ssl_certificate     /etc/letsencrypt/live/aigcog.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aigcog.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- 安全头 ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # 允许上传大图片（/api 路由里的 upload 用）
    client_max_body_size 20M;

    # ------------------------------------------------------------
    # 2.1 前端 SPA（React 打包产物）
    # ------------------------------------------------------------
    root /www/wx-studio/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------
    # 2.2 本地图片静态资源
    # ------------------------------------------------------------
    location /uploads/ {
        alias /www/wx-studio/dist/uploads/;
        autoindex off;
        expires 30d;
        access_log off;
    }

    # ------------------------------------------------------------
    # 2.3 站内 API（前端用，JWT 认证）
    # ------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 生图最长可能几分钟，调大超时
        proxy_connect_timeout  60s;
        proxy_send_timeout     600s;
        proxy_read_timeout     600s;

        # 生图是一次性响应，不需要缓冲
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ------------------------------------------------------------
    # 2.4 登录/短信
    # ------------------------------------------------------------
    location /auth/ {
        proxy_pass http://127.0.0.1:8000/auth/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------
    # 2.5 对外 OpenAI 兼容 API（sk-xxx 认证）
    #     /v1/images/generations  /v1/images/edits  /v1/videos  /v1/models
    # ------------------------------------------------------------
    location /v1/ {
        proxy_pass http://127.0.0.1:8000/v1/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 生图/生视频很慢，超时要长
        proxy_connect_timeout  60s;
        proxy_send_timeout     600s;
        proxy_read_timeout     600s;

        proxy_buffering off;
        proxy_request_buffering off;

        # 对外 API 的错误码不要被 nginx 的默认错误页吞掉
        proxy_intercept_errors off;
    }

    # ------------------------------------------------------------
    # 2.6 日志
    # ------------------------------------------------------------
    access_log /var/log/nginx/aigcog.access.log;
    error_log  /var/log/nginx/aigcog.error.log warn;
}
